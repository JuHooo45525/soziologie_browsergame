<script>
(function(){
"use strict";
const D = window.SOC85_DATA, TASKS = D.tasks;
const TH = {
  parsons:{world:"SYSTEM CITY",person:"Talcott Parsons",theory:"Strukturfunktionalismus",desc:"Wie Werte, Normen und Institutionen das Zusammenleben stabil halten.",accent:"#36F5FF",glow:"rgba(54,245,255,.45)",ok:"SYSTEM RESTORED!",unit:"Gebäude am Netz"},
  dahrendorf:{world:"ROLE WARS",person:"Ralf Dahrendorf",theory:"Homo sociologicus & soziale Rollen",desc:"Positionen, Rollen und Erwartungen – und was passiert, wenn sie kollidieren.",accent:"#FF3CAC",glow:"rgba(255,60,172,.45)",ok:"ROLES DECODED!",unit:"Linien entwirrt"},
  mead:{world:"MIND MIRROR",person:"George Herbert Mead",theory:"Symbolischer Interaktionismus",desc:"Wie das Selbst durch Interaktion und die Perspektiven anderer entsteht.",accent:"#A970FF",glow:"rgba(169,112,255,.5)",ok:"MIRROR ALIGNED!",unit:"Spiegel ausgerichtet"}
};
const ORDER = ["parsons","dahrendorf","mead"];
const BOSS = {accent:"#FFE66D",glow:"rgba(255,230,109,.45)"};
const RANKS = [
  {name:"ROOKIE",req:"Start"},
  {name:"SOCIAL EXPLORER",req:"1 Welt abgeschlossen und 500 Punkte"},
  {name:"THEORY HACKER",req:"2 Welten abgeschlossen und 1.300 Punkte"},
  {name:"SOCIOLOGY ACE",req:"Final Boss besiegt und 2.200 Punkte"}
];
const KEY = "soc85_v1";
let RM = false; try{ RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

const scr = document.getElementById("screen"), ov = document.getElementById("ov");
const $ = s => document.querySelector(s);
let guardUntil = 0;
const guard = ms => { guardUntil = Date.now() + (ms||380); };
const free = () => Date.now() >= guardUntil;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const fmt = n => n.toLocaleString("de-DE");

/* ---------- Zustand & Speicherung ---------- */
function freshState(){
  return {v:1,score:0,introSeen:false,sound:false,answered:0,correct:0,seen:[],tags:{},
    worlds:{parsons:{done:false,best:0},dahrendorf:{done:false,best:0},mead:{done:false,best:0}},
    boss:{done:false},
    stats:{parsons:{n:0,first:0,second:0,fail:0},dahrendorf:{n:0,first:0,second:0,fail:0},mead:{n:0,first:0,second:0,fail:0}}};
}
let S = freshState();
let storageOK = false;
try{ localStorage.setItem("_soc85t","1"); localStorage.removeItem("_soc85t"); storageOK = true; }catch(e){}
function save(){ if(!storageOK) return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  if(!storageOK) return;
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const o = JSON.parse(raw); if(!o || o.v!==1) return;
    const f = freshState();
    S = Object.assign(f, o);
    ORDER.forEach(k=>{ S.worlds[k] = Object.assign(f.worlds[k], (o.worlds||{})[k]); S.stats[k] = Object.assign(freshState().stats[k], (o.stats||{})[k]); });
    S.boss = Object.assign({done:false}, o.boss);
    if(!Array.isArray(S.seen)) S.seen = [];
    if(typeof S.tags!=="object" || !S.tags) S.tags = {};
  }catch(e){ S = freshState(); }
}

/* ---------- Hilfsfunktionen ---------- */
function setAccent(k){
  const c = k==="boss" ? BOSS : (TH[k] || TH.parsons);
  const st = document.documentElement.style;
  st.setProperty("--accent", c.accent); st.setProperty("--glow", c.glow);
}
function unlocked(w){
  if(w==="parsons") return true;
  if(w==="dahrendorf") return S.worlds.parsons.done;
  if(w==="mead") return S.worlds.dahrendorf.done;
  if(w==="boss") return ORDER.every(k=>S.worlds[k].done);
  return false;
}
function worldsDone(){ return ORDER.filter(k=>S.worlds[k].done).length; }
function rankIdx(){
  const w = worldsDone();
  if(S.boss.done && S.score>=2200) return 3;
  if(w>=2 && S.score>=1300) return 2;
  if(w>=1 && S.score>=500) return 1;
  return 0;
}
function mastery(k){
  const st = S.stats[k], n = st.n;
  const ratio = n ? (st.first + 0.5*st.second)/n : 0;
  let label, cls;
  if(n<3){ label = n ? "noch zu wenig Daten" : "noch nicht bearbeitet"; cls="d"; }
  else if(ratio>=0.8){ label="sicher angewendet"; cls="a"; }
  else if(ratio>=0.5){ label="überwiegend verstanden"; cls="b"; }
  else { label="noch zu wiederholen"; cls="c"; }
  return {n, ratio, label, cls, st};
}
function beep(type){
  if(!S.sound) return;
  try{
    window._ac = window._ac || new (window.AudioContext || window.webkitAudioContext)();
    const ac = window._ac; if(ac.state==="suspended") ac.resume();
    const seq = {ok:[[660,.07],[880,.1]],bad:[[260,.1],[200,.14]],click:[[540,.03]],win:[[523,.08],[659,.08],[784,.08],[1046,.18]]}[type] || [[440,.05]];
    let t = ac.currentTime + .01;
    seq.forEach(([f,d])=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02); t += d;
    });
  }catch(e){}
}
function glitch(){ if(RM) return; const a=document.getElementById("app"); a.classList.remove("glitch"); void a.offsetWidth; a.classList.add("glitch"); setTimeout(()=>a.classList.remove("glitch"),480); }
function confetti(){
  if(RM) return;
  const cols=["#36F5FF","#FF3CAC","#A970FF","#FFE66D","#66FF99"];
  for(let i=0;i<46;i++){
    const d=document.createElement("div"); d.className="cf";
    d.style.left=(Math.random()*100)+"vw"; d.style.background=pick(cols);
    d.style.animationDuration=(1.6+Math.random()*1.4)+"s"; d.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),3400);
  }
}
function floatPts(p){
  if(RM) return;
  const s=document.getElementById("hudScore"); if(!s) return;
  const r=s.getBoundingClientRect(), el=document.createElement("div");
  el.className="float"; el.textContent="+"+p;
  el.style.left=Math.max(8,r.left-10)+"px"; el.style.top=(r.bottom+4)+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),1200);
}
function stars(){
  const bg=document.getElementById("bg");
  for(let i=0;i<70;i++){
    const s=document.createElement("div"); s.className="star"+(i%5===0?" tw":"");
    s.style.left=(Math.random()*100)+"%"; s.style.top=(Math.random()*60)+"%";
    if(i%7===0){ s.style.width="3px"; s.style.height="3px"; }
    s.style.animationDelay=(Math.random()*5)+"s";
    bg.appendChild(s);
  }
}
function soundIcon(){ return S.sound ? "🔊" : "🔇"; }
function soundLabel(){ return S.sound ? "🔊 TON: AN" : "🔇 TON: AUS"; }
function refreshSoundButtons(){
  const h=document.getElementById("hudSound"); if(h) h.textContent=soundIcon();
  document.querySelectorAll("[data-sl]").forEach(b=>b.textContent=soundLabel());
}

/* ---------- Overlay ---------- */
function openOv(html){ ov.innerHTML=html; ov.classList.add("open"); ov.scrollTop=0; }
function closeOv(){ ov.classList.remove("open"); ov.innerHTML=""; }
function confirmBox(text, yesAct, yesLabel){
  openOv(`<div class="ovbox confirm"><h2 class="big" style="font-size:clamp(18px,3vw,28px);margin-bottom:20px">SICHER?</h2><p>${esc(text)}</p>
  <div class="menu"><button class="btn primary" data-act="${yesAct}">${esc(yesLabel||"JA")}</button><button class="btn ghost" data-act="closeov">ABBRECHEN</button></div></div>`);
}

/* ---------- Bildschirme ---------- */
function renderStart(){
  run=null; document.body.classList.remove("playing"); setAccent("parsons"); closeOv();
  const logo=[..."SOCIOLOGY ’85"].map((ch,i)=>`<span style="animation-delay:${(i*0.07).toFixed(2)}s">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");
  const has=S.answered>0;
  scr.innerHTML=`<div class="center"><div class="cab">
    <h1 class="logo" aria-label="SOCIOLOGY ’85">${logo}</h1>
    <p class="subtitle" style="margin-top:14px">THE SOCIALIZATION ARCADE</p>
    <p class="coin" style="margin-top:22px">INSERT COIN. UNDERSTAND SOCIETY.</p>
    <div class="menu" style="margin:28px auto 0">
      ${has?`<button class="btn primary" data-act="map">▶ WEITERSPIELEN</button><button class="btn" data-act="newgame">NEUES SPIEL</button>`:`<button class="btn primary" data-act="start">▶ START GAME</button>`}
      <button class="btn" data-act="help">? HOW TO PLAY</button>
      <button class="btn" data-act="db">▤ THEORY DATABASE</button>
      <button class="btn ghost" data-act="sound" data-sl>${soundLabel()}</button>
    </div></div>
    <p class="footnote">„Insert Coin“ ist nur Retro-Deko: Das Spiel ist kostenlos und braucht keine Anmeldung. Für die EF · Sozialisationstheorien nach Parsons, Dahrendorf und Mead.</p>
  </div>`;
  scr.scrollTop=0;
}
function renderIntro(){
  document.body.classList.remove("playing"); glitch();
  scr.innerHTML=`<div class="center"><div class="cab" style="max-width:760px">
    <p class="subtitle">LOADING SOCIETY.EXE …</p>
    <p class="pix" style="font-size:clamp(15px,2.8vw,24px);margin:26px 0;line-height:1.7">Drei Theorien.<br>Drei Welten.<br>Eine Gesellschaft, die verstanden werden will.</p>
    <p style="max-width:560px;margin:0 auto 26px">Regeln werden nicht mehr verstanden, Rollen kollidieren, niemand weiß mehr, wie das eigene Selbst entsteht. Repariere SYSTEM CITY, entwirre ROLE WARS und richte MIND MIRROR aus – dann wartet der Final Boss.</p>
    <button class="btn primary" data-act="intro-done">ZUR WELTKARTE ▶</button>
  </div></div>`;
  scr.scrollTop=0;
}
function renderMap(){
  run=null; document.body.classList.remove("playing"); setAccent("parsons"); closeOv();
  const ri=rankIdx(), next=RANKS[ri+1];
  const bars=ORDER.map(k=>{
    const m=mastery(k), t=TH[k];
    return `<div class="mb" style="--c:${t.accent}"><span class="vt" style="font-size:22px;color:${t.accent}">${t.person}</span> <span class="dim">· ${S.worlds[k].done?"abgeschlossen":"offen"} · ${m.label}</span><div class="bar" role="img" aria-label="${Math.round(m.ratio*100)} Prozent"><i style="width:${Math.round(m.ratio*100)}%"></i></div></div>`;
  }).join("");
  const cards=ORDER.map((k,i)=>{
    const t=TH[k], w=S.worlds[k], un=unlocked(k);
    const prev=i>0?TH[ORDER[i-1]].world:"";
    const status=w.done?'<span class="status done">✓ CLEARED</span>':un?'<span class="status">READY</span>':'<span class="status">🔒 LOCKED</span>';
    return `<article class="card ${un?"":"locked"}" style="--c:${t.accent};--cg:${t.glow}">
      ${status}
      <h2>LEVEL ${i+1} · ${t.world}</h2>
      <div class="who">${t.person}<br><span class="dim" style="font-size:21px">${t.theory}</span></div>
      <p class="desc">${t.desc}</p>
      <div class="dim" style="font-size:16px">${w.done?`Bester Lauf: ${fmt(w.best)} Punkte`:un?"5 Aufgaben · kein Zeitdruck":`Freischalten: Schließe ${prev} ab.`}</div>
      <button class="btn ${un&&!w.done?"primary":""}" data-act="world" data-w="${k}" ${un?"":"disabled"}>${w.done?"NOCHMAL SPIELEN":un?"LEVEL STARTEN ▶":"GESPERRT"}</button>
    </article>`;
  }).join("");
  const bu=unlocked("boss");
  const boss=`<article class="card boss ${bu?"":"locked"}">
      ${S.boss.done?'<span class="status done">✓ BESIEGT</span>':bu?'<span class="status">READY</span>':'<span class="status">🔒 LOCKED</span>'}
      <h2>FINAL BOSS · DECODE SOCIETY</h2>
      <p class="desc">Fünf gemischte Fälle. Entscheide jeweils, welche Theorie die Situation am besten erklärt – und löse das Glitch-Gebilde aus falschen Zuordnungen auf.</p>
      <div class="dim" style="font-size:16px">${bu?"Alle drei Welten sind abgeschlossen.":"Freischalten: Schließe alle drei Welten ab."}</div>
      <button class="btn ${bu&&!S.boss.done?"primary":""}" data-act="boss" ${bu?"":"disabled"}>${S.boss.done?"NOCHMAL ANTRETEN":bu?"BOSS STARTEN ▶":"GESPERRT"}</button>
    </article>`;
  scr.innerHTML=`<div class="wrap">
    <div class="maphead"><h1>ARCADE MAP</h1>
      <div class="rankbox">RANG <b>${RANKS[ri].name}</b><br>SCORE <b>${fmt(S.score)}</b>${next?`<br><span class="dim" style="font-size:19px">Nächster Rang: ${next.name} – ${next.req}</span>`:""}</div></div>
    <div class="minibars">${bars}</div>
    <div class="cards">${cards}${boss}</div>
    <div class="maptools">
      ${S.answered>0?'<button class="btn" data-act="results">▦ LERNSTAND</button>':""}
      <button class="btn" data-act="db">▤ THEORY DATABASE</button>
      <button class="btn" data-act="help">? HOW TO PLAY</button>
      <button class="btn ghost" data-act="arcade">STARTBILDSCHIRM</button>
    </div>
  </div>`;
  scr.scrollTop=0;
}

/* ---------- Spielrunden ---------- */
let run=null;
const cur=()=>run.queue[run.idx];
function choose(pool){ const un=pool.filter(t=>!S.seen.includes(t.id)); return pick(un.length?un:pool); }
function startWorld(w){
  if(!unlocked(w)) return;
  const q=[];
  for(let st=1;st<=5;st++) q.push(choose(TASKS.filter(t=>t.theory===w && t.stage===st)));
  beginRun({mode:"world",key:w,queue:q});
}
function startBoss(){
  if(!unlocked("boss")) return;
  const pool=TASKS.filter(t=>t.theory==="boss");
  let q=ORDER.map(k=>choose(pool.filter(t=>t.solves===k)));
  q=q.concat(shuffle(pool.filter(t=>!q.includes(t))).slice(0,2));
  beginRun({mode:"boss",key:"boss",queue:shuffle(q)});
}
function startPractice(){
  const q=[]; const add=t=>{ if(t && !q.includes(t) && q.length<5) q.push(t); };
  const freshFirst=list=>shuffle(list).sort((a,b)=>(S.seen.includes(a.id)?1:0)-(S.seen.includes(b.id)?1:0));
  Object.keys(S.tags).sort((a,b)=>S.tags[b]-S.tags[a]).forEach(tag=>{
    const c=freshFirst(TASKS.filter(t=>t.tag===tag && t.theory!=="boss"));
    add(c[0]); if(S.tags[tag]>1) add(c[1]);
  });
  ORDER.filter(k=>{ const m=mastery(k); return m.n>0 && m.ratio<0.8; }).sort((a,b)=>mastery(a).ratio-mastery(b).ratio)
    .forEach(k=>freshFirst(TASKS.filter(t=>t.theory===k)).slice(0,2).forEach(add));
  let note="";
  if(!q.length){ note="Keine Schwachstellen erkannt – hier ist ein gemischtes Bonustraining."; freshFirst(TASKS.filter(t=>t.theory!=="boss")).slice(0,5).forEach(add); }
  beginRun({mode:"practice",key:"practice",queue:q,note});
}
function beginRun(o){
  closeOv();
  run={mode:o.mode,key:o.key,queue:o.queue,core:o.queue.length,idx:0,levelScore:0,reviews:0,qTags:{},log:[],note:o.note||""};
  document.body.classList.add("playing");
  setAccent(o.mode==="practice"?"mead":o.key);
  glitch(); newTask(); renderTask(); guard(500);
}
function newTask(){
  const t=cur();
  Object.assign(run,{att:0,sel:null,wrong:[],locked:false,hint:false,assign:{},fixed:{},wrongItems:[],pickI:0,addedReview:false,
    order:(t.type==="mc"||t.type==="compare")?shuffle(t.options.map((_,i)=>i)):null});
}
function stageName(t){
  if(run.mode==="boss") return `FINAL BOSS · FALL ${run.idx+1}`;
  if(run.idx>=run.core) return "REPLAY · Gezielte Wiederholung";
  if(run.mode==="practice") return `TRAINING · ${t.theory==="boss"?"Gemischt":TH[t.theory].person}`;
  return `STAGE ${t.stage} · ${D.stages[t.stage]}`;
}
function renderTask(){
  const t=cur();
  scr.innerHTML=`<div class="wrap"><div class="tg">
    <section>
      <div class="scene" id="scene">${scene()}</div>
      <div class="panel">
        <div class="stage">${esc(stageName(t))}</div>
        ${run.note&&run.idx===0?`<p class="small">${esc(run.note)}</p>`:""}
        ${t.situation?`<div class="situation">${esc(t.situation)}</div>`:""}
        <p class="question" id="qtext">${esc(t.q)}</p>
        ${t.type==="assign"?'<p class="instr">Tippe eine Beschreibung an und dann unten den passenden Begriff. Zum Ändern tippst du die Beschreibung einfach noch einmal an.</p>':""}
        <div class="tools"><button class="tbtn" data-act="hint" id="hintBtn">💡 HINWEIS</button><button class="tbtn" data-act="db">▤ DATABASE</button></div>
        <div class="hintbox" id="hintbox" hidden>${esc(t.hint)}</div>
      </div>
    </section>
    <section>
      <div class="answers" id="answers" role="group" aria-labelledby="qtext"></div>
      <button class="btn primary check" id="check" data-act="check" disabled>ANTWORT PRÜFEN</button>
      <div id="fb"></div>
    </section>
  </div></div>`;
  renderAnswers(); updateHud(); scr.scrollTop=0;
}
function optClass(key,t){
  let c="opt", dis=run.locked;
  const isWrong=run.wrong.some(w=>String(w)===String(key));
  if(isWrong){ c+=" wrong out"; dis=true; }
  if(String(run.sel)===String(key)) c+=" sel";
  if(run.locked && String(key)===String(t.correct)) c+=" right";
  if(run.locked && String(run.sel)===String(key) && String(key)!==String(t.correct)) c+=" wrong";
  return {c,dis};
}
function renderAnswers(){
  const t=cur(), box=document.getElementById("answers"); if(!box) return;
  let h="";
  if(t.type==="mc"||t.type==="compare"){
    const L=t.type==="mc"?"ABCD":"AB";
    run.order.forEach((oi,pos)=>{
      const {c,dis}=optClass(oi,t);
      h+=`<button class="${c}" data-act="opt" data-i="${oi}" ${dis?"disabled":""} aria-pressed="${run.sel===oi}"><span class="badge">${L[pos]}</span><span class="ot">${t.type==="compare"?"<b>Aussage "+L[pos]+":</b> ":""}${esc(t.options[oi])}</span></button>`;
    });
  } else if(t.type==="theory"){
    ORDER.forEach((k,pos)=>{
      const {c,dis}=optClass(k,t);
      h+=`<button class="${c}" data-act="opt" data-i="${k}" ${dis?"disabled":""} aria-pressed="${run.sel===k}" style="--accent:${TH[k].accent}"><span class="badge">${pos+1}</span><span class="ot"><span class="th-name">${TH[k].person}</span><span class="th-sub">${TH[k].theory}</span></span></button>`;
    });
  } else if(t.type==="assign"){
    t.items.forEach((it,i)=>{
      const a=run.assign[i]; let c="opt item";
      const fixed=!!run.fixed[i];
      if(!run.locked && !fixed && run.pickI===i) c+=" pick";
      if(fixed || (run.locked && a===it.cat)) c+=" right";
      if(run.locked && a!==it.cat) c+=" wrong";
      const chip = a!==undefined ? `<span class="chip">→ ${esc(a)}</span>` : (run.wrongItems.includes(i)?'<span class="chip empty">neu zuordnen</span>':'<span class="chip empty">noch offen</span>');
      const fix = run.locked && a!==it.cat ? ` <span class="chip okc">richtig: ${esc(it.cat)}</span>` : "";
      h+=`<button class="${c}" data-act="item" data-i="${i}" ${run.locked||fixed?"disabled":""}><span class="badge">${i+1}</span><span class="ot">${esc(it.text)}<br>${chip}${fix}</span></button>`;
    });
    h+=`<div class="cats">${t.cats.map(c=>`<button class="btn cat" data-act="cat" data-c="${esc(c)}" ${run.locked?"disabled":""}>${esc(c)}</button>`).join("")}</div>`;
  }
  box.innerHTML=h;
  updateCheck();
}
function updateCheck(){
  const b=document.getElementById("check"); if(!b) return;
  const t=cur();
  if(run.locked){ b.style.display="none"; return; }
  b.style.display="";
  const ready = t.type==="assign" ? Object.keys(run.assign).length===t.items.length : run.sel!==null;
  b.disabled=!ready;
}
function selOpt(v){
  if(!run||run.locked) return;
  const t=cur();
  run.sel = t.type==="theory" ? v : Number(v);
  beep("click"); renderAnswers();
}
function selItem(i){
  if(!run||run.locked||run.fixed[i]) return;
  run.pickI=i; delete run.assign[i]; beep("click"); renderAnswers();
}
function selCat(c){
  if(!run||run.locked) return;
  const t=cur();
  const open=t.items.map((_,i)=>i).filter(i=>!run.fixed[i] && run.assign[i]===undefined);
  let target = (run.pickI!==null && !run.fixed[run.pickI] && run.assign[run.pickI]===undefined) ? run.pickI : open[0];
  if(target===undefined) return;
  run.assign[target]=c;
  const rest=t.items.map((_,i)=>i).filter(i=>!run.fixed[i] && run.assign[i]===undefined);
  run.pickI = rest.length ? (rest.find(i=>i>target) ?? rest[0]) : null;
  beep("click"); renderAnswers();
}
function showHint(){
  if(!run) return;
  run.hint=true;
  const hb=document.getElementById("hintbox"), btn=document.getElementById("hintBtn");
  if(hb) hb.hidden=false; if(btn) btn.disabled=true;
}
function check(){
  if(!run||run.locked||!free()) return;
  guard(320);
  const t=cur(); let correct;
  if(t.type==="assign"){
    if(Object.keys(run.assign).length<t.items.length) return;
    correct=t.items.every((it,i)=>run.assign[i]===it.cat);
  } else {
    if(run.sel===null) return;
    correct=String(run.sel)===String(t.correct);
  }
  run.att++;
  if(correct){ resolve(run.att===1?"first":"second"); return; }
  if(run.att===1){
    firstMiss(t);
    if(t.type==="assign"){
      run.wrongItems=[];
      t.items.forEach((it,i)=>{ if(run.assign[i]===it.cat) run.fixed[i]=true; else { delete run.assign[i]; run.wrongItems.push(i); } });
      run.pickI=run.wrongItems[0];
    } else { run.wrong.push(run.sel); run.sel=null; }
    renderAnswers(); showTry(t); beep("bad");
    const a=document.getElementById("answers"); if(a&&!RM){ a.classList.remove("jolt"); void a.offsetWidth; a.classList.add("jolt"); }
    return;
  }
  resolve("fail");
}
function firstMiss(t){
  S.tags[t.tag]=(S.tags[t.tag]||0)+1;
  if(run.reviews>=2 || run.qTags[t.tag]) return;
  const inQ=id=>run.queue.some(x=>x.id===id);
  const c=TASKS.filter(x=>x.tag===t.tag && x.id!==t.id && !inQ(x.id) && x.theory!=="boss")
    .map(x=>({x,s:(x.stage===0?0:2)+(S.seen.includes(x.id)?1:0)+Math.random()*.5}))
    .sort((a,b)=>a.s-b.s);
  if(c.length){ run.queue.push(c[0].x); run.reviews++; run.qTags[t.tag]=1; run.addedReview=true; }
  save();
}
function showTry(t){
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="panel fb bad"><h3>NOT QUITE – TRY AGAIN.</h3><p>${esc(t.hint)}</p>
    ${t.type==="assign"?'<p class="small">Richtig zugeordnete Beschreibungen sind grün und bleiben stehen.</p>':""}
    ${run.addedReview?'<p class="small">Eine ähnliche Aufgabe kommt am Ende des Levels noch einmal – zum Festigen.</p>':""}</div>`;
  run.addedReview=false;
  updateHud(); scrollTo(fb);
}
function okTitle(){
  if(run.mode==="boss") return "GLITCH DELETED!";
  if(run.mode==="practice") return "SKILL UPGRADED!";
  return TH[run.key].ok;
}
function resolve(res){
  run.locked=true;
  const t=cur(), pts=res==="first"?100:res==="second"?50:0;
  S.score+=pts; run.levelScore+=pts;
  const th=t.theory==="boss"?t.solves:t.theory, st=S.stats[th];
  st.n++; st[res]++; S.answered++; if(res!=="fail") S.correct++;
  if(!S.seen.includes(t.id)) S.seen.push(t.id);
  run.log.push({id:t.id,res,review:run.idx>=run.core});
  if(t.type!=="assign" && res!=="fail") run.sel=t.correct;
  save();
  renderAnswers(); updateHud();
  const sc=document.getElementById("scene"); if(sc) sc.innerHTML=scene();
  const last=run.idx===run.queue.length-1;
  const title=res==="fail"?"SIGNAL LOST – SO GEHT’S":okTitle();
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="panel fb ${res==="fail"?"info":"good"} ${res!=="fail"&&!RM?"pulse":""}">
    <h3>${title}</h3>
    <div class="pts">${pts?"+"+pts+" PUNKTE":"0 PUNKTE"}${res==="second"?" · 2. Versuch":""}</div>
    ${res==="fail"?'<p class="small">Die richtige Lösung ist grün markiert.</p>':""}
    <p>${esc(t.explain)}</p>
    <button class="btn primary" data-act="next">${last?(run.mode==="boss"?"AUSWERTUNG ▶":"LEVEL ABSCHLIESSEN ▶"):"WEITER ▶"}</button>
  </div>`;
  if(pts) floatPts(pts);
  beep(res==="fail"?"bad":"ok");
  guard(450); scrollTo(fb);
}
function scrollTo(el){ try{ el.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"}); }catch(e){ el.scrollIntoView(false); } }
function next(){

}

function scene(){
  if(!run) return "";
  const solved=Math.min(5, run.log.filter(l=>l.res!=="fail").length);
  let svg, cap;
  if(run.mode==="boss"){ svg=bossScene(solved); cap=`${solved}/5 Glitch-Blöcke aufgelöst`; }
  else if(run.mode==="practice"){ svg=practiceScene(solved); cap=`${solved}/${Math.min(5,run.core)} Skills geladen`; }
  else if(run.key==="parsons"){ svg=parsonsScene(solved); cap=`${solved}/5 ${TH.parsons.unit}`; }
  else if(run.key==="dahrendorf"){ svg=dahrendorfScene(solved); cap=`${solved}/5 ${TH.dahrendorf.unit}`; }
  else { svg=meadScene(solved); cap=`${solved}/5 ${TH.mead.unit}`; }
  return svg+`<div class="scene-cap">${cap}</div>`;
}

}
function openHelp(){
  openOv(`<div class="ovbox"><div class="ovhead"><h2>HOW TO PLAY</h2><button class="btn ghost" data-act="closeov">✕ SCHLIESSEN</button></div>
  <div class="helpbox">
    <ul>
      <li><b>Welten:</b> Jede Welt steht für eine Theorie und hat fünf Aufgaben – vom Grundverständnis bis zur Abgrenzung von anderen Theorien. Die nächste Welt wird frei, sobald du die vorherige abgeschlossen hast. Abschließen kannst du jede Welt immer – auch mit Fehlern.</li>
      <li><b>Antworten:</b> Tippe eine Antwort an und dann auf „Antwort prüfen“. Bei Zuordnungen tippst du erst eine Beschreibung und dann den Begriff.</li>
      <li><b>Punkte:</b> 100 beim ersten Versuch, 50 beim zweiten. Nach zwei Fehlversuchen erklärt das Spiel die Lösung und du spielst normal weiter. Erster Abschluss einer Welt: +200. Final Boss: +150.</li>
      <li><b>Hinweis:</b> Der Hinweis-Button kostet keine Punkte.</li>
      <li><b>Replay:</b> Bei einem Fehler kommt am Ende des Levels eine ähnliche Aufgabe – zum Festigen.</li>
      <li><b>Database:</b> Alle Fachbegriffe kannst du jederzeit nachschlagen, auch während einer Aufgabe.</li>
      <li><b>Ränge:</b> ROOKIE → SOCIAL EXPLORER → THEORY HACKER → SOCIOLOGY ACE.</li>
      <li><b>Kein Zeitdruck.</b> Ton ist standardmäßig aus und wird für keine Aufgabe gebraucht.</li>
      <li><b>Partnerarbeit:</b> Besprecht jede Antwort, bevor ihr auf „Antwort prüfen“ tippt.</li>
    </ul>
    <p class="small">${storageOK?"Dein Spielstand wird nur lokal in diesem Browser auf diesem Gerät gespeichert. Es werden keine Daten übertragen. Löschen kannst du ihn über „Spielstand zurücksetzen“ im Pause-Menü.":"Lokale Speicherung ist in diesem Browser nicht verfügbar. Das Spiel funktioniert trotzdem – dein Fortschritt bleibt erhalten, solange dieser Tab geöffnet ist."}</p>
  </div></div>`);
}
function openPause(){
  openOv(`<div class="ovbox" style="text-align:center;padding-top:6vh">
    <h2 class="big" style="margin-bottom:12px">PAUSE</h2>
    <p class="dim">Deine Aufgabe und dein Punktestand bleiben genau so erhalten.</p>
    <div class="menu" style="margin:22px auto 0">
      <button class="btn primary" data-act="closeov">▶ WEITERSPIELEN</button>
      <button class="btn" data-act="db">▤ THEORY DATABASE</button>
      <button class="btn" data-act="help">? HOW TO PLAY</button>
      <button class="btn" data-act="sound" data-sl>${soundLabel()}</button>
      <button class="btn ghost" data-act="leave">ZUR WELTKARTE</button>
      <button class="btn ghost" data-act="reset">SPIELSTAND ZURÜCKSETZEN</button>
    </div></div>`);
}
function resetAll(keepSeen){
  const keep={sound:S.sound,introSeen:S.introSeen,seen:keepSeen?S.seen.slice():[]};
  S=freshState(); S.sound=keep.sound; S.introSeen=keep.introSeen; S.seen=keep.seen;
  if(!keepSeen){ try{ localStorage.removeItem(KEY); }catch(e){} }
  save();
}

/* ---------- Eingaben ---------- */
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a=b.dataset.act;
  switch(a){
    case "start": beep("click"); if(S.introSeen) renderMap(); else renderIntro(); break;
    case "intro-done": S.introSeen=true; save(); glitch(); renderMap(); break;
    case "map": if(!free()) return; guard(); closeOv(); renderMap(); break;
    case "arcade": renderStart(); break;
    case "world": if(!free()) return; guard(); startWorld(b.dataset.w); break;
    case "boss": if(!free()) return; guard(); startBoss(); break;
    case "opt": selOpt(b.dataset.i); break;
    case "item": selItem(Number(b.dataset.i)); break;
    case "cat": selCat(b.dataset.c); break;
    case "check": check(); break;
    case "hint": showHint(); break;
    case "next": next(); break;
    case "db": openDB(run && run.mode==="world" ? cur().theory : null); break;
    case "dbtab": dbTab=b.dataset.t; dbOpen=-1; drawDB(); break;
    case "dbitem": { const i=Number(b.dataset.i); dbOpen = dbOpen===i ? -1 : i; drawDB(); break; }
    case "dbgo": openDB(b.dataset.t, Number(b.dataset.e)); break;
    case "help": openHelp(); break;
    case "pause": openPause(); break;
    case "closeov": closeOv(); break;
    case "sound": S.sound=!S.sound; save(); refreshSoundButtons(); beep("ok"); break;
    case "leave": confirmBox("Level verlassen? Bereits erspielte Punkte bleiben erhalten. Das Level startet beim nächsten Mal von vorn.","doleave","JA, ZUR WELTKARTE"); break;
    case "doleave": closeOv(); renderMap(); break;
    case "reset": confirmBox("Spielstand komplett zurücksetzen? Punkte, freigeschaltete Welten und Auswertung werden gelöscht.","doreset","JA, ZURÜCKSETZEN"); break;
    case "newgame": confirmBox("Neues Spiel starten? Dein bisheriger Spielstand wird gelöscht.","doreset","JA, NEU STARTEN"); break;
    case "doreset": resetAll(false); renderStart(); break;
    case "results": renderResults(false,0); break;
    case "again": resetAll(true); glitch(); renderMap(); break;
    case "weak": if(!free()) return; guard(); startPractice(); break;
  }
});
document.addEventListener("keydown", e=>{
  if(ov.classList.contains("open")){ if(e.key==="Escape") closeOv(); return; }
  if(!run) return;
  const t=cur();
  if(!run.locked && /^[1-4]$/.test(e.key)){
    const n=Number(e.key)-1;
    if((t.type==="mc"||t.type==="compare") && run.order[n]!==undefined) selOpt(run.order[n]);
    if(t.type==="theory" && ORDER[n]) selOpt(ORDER[n]);
  }
  if(e.key==="Enter"){ if(run.locked) next(); else if(!document.getElementById("check").disabled) check(); }
  if(e.key==="Escape") openPause();
});
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); });

/* ---------- Start ---------- */
stars(); load(); renderStart();
})();
</script>
</body>
</html>
